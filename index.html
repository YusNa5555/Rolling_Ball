<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rolling Ball</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#fff7e8;
  --panel:rgba(26,16,48,.78);
  --gold:#ffc83d;
  --coral:#ff5d6c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{
  margin:0;height:100%;overflow:hidden;background:#2a1b4d;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#hud{
  position:fixed;left:0;right:0;top:0;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;
  display:flex;align-items:center;gap:12px;pointer-events:none;
}
.chip{
  background:var(--panel);border-radius:999px;padding:6px 14px;
  font-weight:800;font-size:15px;white-space:nowrap;
}
.coinIcon{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid #c98f00;margin-right:7px;vertical-align:-2px}
#snd{pointer-events:auto;appearance:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;width:36px;height:32px;padding:0}
#snd:focus-visible{outline:3px solid #fff;outline-offset:2px}
#snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ffc83d,#ff5d6c);border-radius:99px}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
  border:3px solid rgba(255,247,232,.55);background:rgba(255,247,232,.12);pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  background:rgba(255,200,61,.9)}
.round{appearance:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.round:focus-visible,.tile:focus-visible{outline:3px solid #fff;outline-offset:2px}
.round svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#gear,#snd2{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px)}
#gear{left:14px}
#snd2{right:14px}
#settings{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(14,6,32,.78);z-index:10}
#sCard{background:#2e2058;border-radius:26px;padding:20px;width:min(380px,100%);max-height:100%;overflow:auto}
#sHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#sHead h2{margin:0;font-size:24px;font-weight:900;letter-spacing:.04em}
#sSub{font-size:15px;font-weight:900;color:var(--gold);margin:8px 0 10px;line-height:1.5}
#sInfo{font-size:14px;font-weight:700;line-height:1.8;margin-bottom:14px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px}
#sInfo .r{display:flex;justify-content:space-between;gap:12px}
#sInfo .ok{color:#7dffa6}
#sGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{position:relative;appearance:none;border:3px solid transparent;border-radius:18px;background:rgba(255,255,255,.08);padding:10px 4px 8px;color:inherit;font:inherit;font-size:12px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile.sel{border-color:var(--gold);background:rgba(255,200,61,.16)}
.tile canvas{position:static;inset:auto;width:64px;height:64px;display:block}
.tile.locked canvas{filter:grayscale(1) brightness(.55)}
.tile .lk{position:absolute;top:26px;left:50%;margin-left:-11px;width:22px;height:22px;display:none}
.tile.locked .lk{display:block}
.tile .lk svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.coinIcon.sm{width:11px;height:11px;border-width:2px;margin-right:4px;vertical-align:-1px}
.tile .tag{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#ffe9a8;min-height:16px}
.tile.sel .tag{color:var(--gold)}
.tile.pend{border-color:#7dffa6;background:rgba(125,255,166,.15)}
.tile.pend .tag{color:#7dffa6}
.tile:disabled{color:inherit;cursor:not-allowed}
.tile.off{opacity:.42;filter:grayscale(1)}
.keep{appearance:none;width:100%;margin-top:16px;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:var(--ink);font:inherit;font-weight:900;font-size:16px;padding:13px;cursor:pointer}
.keep:active{background:rgba(255,255,255,.24)}
.keep:focus-visible{outline:3px solid #fff;outline-offset:2px}
#rsChip{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);padding:5px 12px;font-size:14px}
#rsChip svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.sLabel{font-size:13px;font-weight:800;opacity:.7;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px}
.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:16px;padding:12px}
.item svg{width:40px;height:40px;flex:none;fill:none;stroke:#ffc83d;stroke-width:2.4;stroke-linecap:round}
.itxt{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
.itxt b{font-size:16px}
.itxt small{opacity:.75}
.own{color:var(--gold);font-weight:900}
.buy{appearance:none;border:0;border-radius:999px;background:var(--gold);color:#3a2000;font:inherit;font-weight:900;font-size:14px;padding:10px 14px;cursor:pointer;display:flex;align-items:center;white-space:nowrap}
.buy.pend{background:#7dffa6}
.buy:disabled{opacity:.4;filter:grayscale(1);cursor:not-allowed}
.buy:focus-visible{outline:3px solid #fff;outline-offset:2px}
#lifeChip{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 58px);padding:6px 12px;font-size:0;line-height:1}
.hrt{width:15px;height:15px;margin-right:3px;vertical-align:-2px;fill:#ff6b7f;stroke:#ff6b7f;stroke-width:2;stroke-linejoin:round}
.hrt.off{fill:none;opacity:.5}
#choice{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(14,6,32,.5);z-index:8}
#chCard{background:var(--panel);border-radius:24px;padding:22px 22px 20px;width:min(320px,100%);text-align:center;backdrop-filter:blur(6px)}
.chIcon svg{width:58px;height:58px;fill:none;stroke:#ffc83d;stroke-width:2.4;stroke-linecap:round}
#chTxt{font-size:22px;font-weight:900;margin:6px 0 2px}
#chSub{opacity:.85;font-weight:700;margin-bottom:16px}
#chSub b{color:var(--gold)}
#chUse{width:100%;justify-content:center;font-size:18px;padding:13px}
#chNo{margin-top:10px}
#toast{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;opacity:0;transition:opacity .25s;font-size:30px;font-weight:900;letter-spacing:.04em;color:#fff;text-shadow:0 2px 0 rgba(40,10,60,.55),0 0 14px rgba(40,10,60,.5);white-space:nowrap}
@keyframes lifePulse{0%{transform:scale(1)}30%{transform:scale(1.4)}100%{transform:scale(1)}}
#lifeChip.pulse{animation:lifePulse .5s}
#overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(20,10,40,.28);
}
#card{
  background:var(--panel);border-radius:28px;padding:28px 26px;width:min(340px,100%);
  text-align:center;backdrop-filter:blur(6px);
}
#title{font-size:38px;font-weight:900;margin:0 0 18px;line-height:1.1;letter-spacing:.04em}
#msg{margin:0 0 20px;font-size:15px;line-height:1.6;opacity:.9}
#go{
  appearance:none;border:0;border-radius:999px;background:var(--gold);color:#3a2000;
  font:inherit;font-weight:900;font-size:18px;padding:14px 36px;cursor:pointer;
  box-shadow:0 5px 0 #c98f00;
}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #c98f00}
#go:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div id="hud">
  <div class="chip" id="lv">Lv 1</div>
  <div id="bar"><div id="fill"></div></div>
  <div class="chip"><span class="coinIcon"></span><span id="gm">0</span></div>
  <button id="snd" class="chip" aria-label="Sound on/off" type="button"></button>
  <div class="chip" id="rsChip" aria-label="Rescue items"><svg viewBox="0 0 24 24"><circle cx="11" cy="13" r="7"/><path d="M18 12.5l4 1.5-4 1.5"/><circle cx="14.5" cy="11" r="1" fill="currentColor" stroke="none"/><path d="M8 14q3-4 6 0"/><path d="M9 20v2M13 20v2"/></svg><span id="rs">0</span></div>
  <div class="chip" id="lifeChip" aria-label="Lives"></div>
</div>
<div id="stick"><div id="knob"></div></div>
<div id="overlay">
  <button id="gear" class="round" style="display:none;width:auto;padding:0 16px;gap:8px;font:inherit;font-weight:900;font-size:15px;letter-spacing:.04em" type="button" aria-label="Ball shop"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>SHOP</span></button>
  <button id="snd2" class="round" type="button" aria-label="Sound on/off"></button>
  <div id="card">
    <h1 id="title" style="display:none"></h1>
    <p id="msg" style="display:none"></p>
    <button id="go">START</button>
  </div>
</div>

<div id="toast"></div>
<div id="choice">
  <div id="chCard">
    <div class="chIcon"><svg viewBox="0 0 48 48"><circle cx="22" cy="26" r="14"/><path d="M36 25l8 3-8 3"/><circle cx="29" cy="22" r="1.8" fill="#ffc83d" stroke="none"/><path d="M15 28q7-9 14 0"/><path d="M18 40v5M26 40v5"/><path d="M19 12l-2-5M23 11l0-5M27 12l2-5"/></svg></div>
    <div id="chTxt">Use a Rescue Bird?</div>
    <div id="chSub">You have <b id="chN">0</b></div>
    <button id="chUse" class="buy" type="button">USE</button>
    <button id="chNo" class="keep" type="button">No thanks</button>
  </div>
</div>

<div id="settings">
  <div id="sCard">
    <div id="sHead">
      <h2>BALL SHOP</h2>
      <button id="sClose" class="round" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
    </div>
    <div id="sSub" style="display:none"></div>
    <div id="sInfo"></div>
    <div class="sLabel" style="margin-top:0">Ball designs</div>
    <div id="sGrid"></div>
    <div class="sLabel">Items</div>
    <div id="sItems"></div>
    <button id="sKeep" class="keep" type="button">No change</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
function showErr(msg){
  let d = document.getElementById("err");
  if(!d){
    d = document.createElement("div"); d.id = "err";
    d.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#4a0d14;color:#fff;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;pointer-events:none;white-space:pre-wrap";
    document.body.appendChild(d);
  }
  d.textContent = "Error: " + msg;
}
window.addEventListener("error", ev=>{ showErr((ev.message || "") + (ev.lineno ? " (line " + ev.lineno + ")" : "")); });

/* ---------- 基本設定 ---------- */
const R = 0.5;            // ボール半径
const GRAV = 26;
const $ = id => document.getElementById(id);

let best = 1;
try { best = parseInt(localStorage.getItem("rb_level")||"1",10) || 1; } catch(e){}
let level = best;
let gems = 0;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
document.body.prepend(renderer.domElement);
// 強く押したときの拡大鏡・メニューを出さない
["touchstart","touchmove"].forEach(ev=>renderer.domElement.addEventListener(ev, e=>{ e.preventDefault(); }, {passive:false}));
["contextmenu","selectstart","gesturestart","dragstart"].forEach(ev=>window.addEventListener(ev, e=>{ e.preventDefault(); }, {passive:false}));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xffffff, 0x6a4f9a, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 0.8);
sun.position.set(-4, 10, 6);
scene.add(sun);

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 72 : 62;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

/* ---------- テクスチャ ---------- */
function makeCanvasTex(draw, size){
  const c = document.createElement("canvas");
  c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const checkerTex = makeCanvasTex((g,s)=>{
  g.fillStyle="#ffffff"; g.fillRect(0,0,s,s);
  g.fillStyle="#d9d2ea"; g.fillRect(0,0,s/2,s/2); g.fillRect(s/2,s/2,s/2,s/2);
}, 64);
const ballTex = makeCanvasTex((g,s)=>{
  g.fillStyle="#ff5d6c"; g.fillRect(0,0,s,s);
  g.fillStyle="#fff7e8";
  for(let i=0;i<4;i++){ g.fillRect(0, i*s/4+s/16, s, s/8); }
  g.fillStyle="#ffc83d"; g.fillRect(0, 0, s/2, s);
  g.globalAlpha=.9; g.fillStyle="#ff5d6c"; g.fillRect(s/2, 0, s/2, s);
  g.fillStyle="#fff7e8";
  for(let i=0;i<4;i++){ g.fillRect(0, i*s/4+s/16, s, s/10); }
}, 128);
ballTex.wrapS = ballTex.wrapT = THREE.ClampToEdgeWrapping;

/* ---------- ボール ---------- */
const ballMesh = new THREE.Mesh(
  new THREE.SphereGeometry(R, 32, 24),
  new THREE.MeshPhongMaterial({map:ballTex, shininess:60})
);
scene.add(ballMesh);

/* ---------- 文字テクスチャ ---------- */
function makeTextTex(text, w, h, fg, bg, stroke){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  if(bg){ g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.font = "900 " + Math.floor(h * 0.7) + "px system-ui, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  if(stroke){ g.lineWidth = h * 0.1; g.strokeStyle = stroke; g.lineJoin = "round"; g.strokeText(text, w/2, h/2 + h*0.04); }
  g.fillStyle = fg; g.fillText(text, w/2, h/2 + h*0.04);
  const t = new THREE.CanvasTexture(c);
  return t;
}
function floorPlane(tex, w, h, x, y, d){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false}));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y + 0.02, -d);
  return m;
}

/* ---------- サウンド ---------- */
let actx = null;
function silentWavURI(){
  const sr = 8000, n = sr / 2, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4, 36 + n, true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
  w(36,"data"); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i, 128);
  let bin = ""; const u = new Uint8Array(buf);
  for(let i=0;i<u.length;i++) bin += String.fromCharCode(u[i]);
  return "data:audio/wav;base64," + btoa(bin);
}
let silentEl = null;
let muted = true;   // 初期はオフ
try{ const sv = localStorage.getItem("rb_muted"); if(sv !== null) muted = sv === "1"; }catch(e){}
function unlockAudio(){
  try{
    // iOS：マナーモードでも「メディア再生」として鳴らす
    if(navigator.audioSession) navigator.audioSession.type = "playback";
    if(!silentEl){
      silentEl = document.createElement("audio");
      silentEl.src = silentWavURI();
      silentEl.loop = true;
      silentEl.setAttribute("playsinline", "");
      silentEl.volume = 0.01;
    }
    if(silentEl.paused){ const pr = silentEl.play(); if(pr && pr.catch) pr.catch(()=>{}); }
  }catch(e){}
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === "suspended") actx.resume();
  }catch(e){}
}
["pointerdown","pointerup","touchend","click","keydown"].forEach(ev=>window.addEventListener(ev, unlockAudio, {passive:true}));
function playCoin(){
  if(!actx || muted) return;
  if(actx.state !== "running") actx.resume();
  try{
    const t = actx.currentTime;
    [[987.77, 0, 0.14], [1318.51, 0.08, 0.16]].forEach(([f, off, vol])=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.setValueAtTime(f, t + off);
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(vol, t + off + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + (off ? 0.38 : 0.1));
      o.connect(g); g.connect(actx.destination);
      o.start(t + off); o.stop(t + off + 0.4);
    });
  }catch(e){}
}

function playMiss(){
  if(!actx || muted) return;
  if(actx.state !== "running") actx.resume();
  try{
    const t = actx.currentTime;
    const note = (f0, f1, off, dur, vol)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(f0, t + off);
      if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + off + dur);
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(vol, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t + off); o.stop(t + off + dur + 0.05);
    };
    // プ・プ・プ・プゥーン…（残念感）
    note(523, 523, 0, 0.16, 0.15);
    note(494, 494, 0.17, 0.16, 0.15);
    note(466, 466, 0.34, 0.16, 0.15);
    note(440, 196, 0.51, 0.75, 0.17);
  }catch(e){}
}
function buildCat(sx){
  const g = new THREE.Group();
  const fur = new THREE.MeshPhongMaterial({color:0xffa94d, shininess:30});
  const white = new THREE.MeshPhongMaterial({color:0xfff3e0});
  const dark = new THREE.MeshPhongMaterial({color:0xd9822b});
  const black = new THREE.MeshPhongMaterial({color:0x1a1210, shininess:90});
  const pink = new THREE.MeshPhongMaterial({color:0xff8fa3});
  const shine = new THREE.MeshBasicMaterial({color:0xffffff});
  const sph = (r, mat, kx, ky, kz, x, y, z)=>{
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
    m.scale.set(kx, ky, kz); m.position.set(x, y, z); g.add(m); return m;
  };
  sph(0.46, fur, 1.0, 1.0, 0.95, 0, 0.46, 0);                // 体（小さめ）
  sph(0.32, white, 0.9, 0.9, 0.5, 0, 0.4, 0.32);             // おなか
  sph(0.46, fur, 1.12, 0.95, 0.98, 0, 1.08, 0.05);           // 頭（大きめでまるく）
  [-1, 1].forEach(e=>{
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.24, 4), fur);
    ear.position.set(e * 0.3, 1.42, 0.0); ear.rotation.z = -e * 0.35; g.add(ear);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.15, 4), pink);
    inner.position.set(e * 0.3, 1.4, 0.07); inner.rotation.z = -e * 0.35; g.add(inner);
    sph(0.062, black, 1, 1.25, 0.6, e * 0.22, 1.12, 0.43);   // 目（小さく、はなして）
    sph(0.02, shine, 1, 1, 1, e * 0.22 + 0.02, 1.16, 0.47);  // 目のきらり

function mergeGeos(list){
  const arrs = list.map(g => (g.index ? g.toNonIndexed() : g).attributes.position.array);
  let n = 0; arrs.forEach(a => { n += a.length; });
  const out = new Float32Array(n); let o = 0;
  arrs.forEach(a => { out.set(a, o); o += a.length; });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(out, 3));
  geo.computeVertexNormals();
  return geo;
}
function buildHedgehog(){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhongMaterial({color:0xa8714a});
  const faceMat = new THREE.MeshPhongMaterial({color:0xf3d2a8});
  const spikeMat = new THREE.MeshPhongMaterial({color:0x4a2f22});
  const black = new THREE.MeshPhongMaterial({color:0x151010, shininess:80});
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), bodyMat);
  body.scale.set(1.05, 0.85, 0.95); body.position.y = 0.42; g.add(body);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), faceMat);
  face.scale.set(1.25, 0.9, 0.9); face.position.set(0.5, 0.34, 0); g.add(face);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), black);
  nose.position.set(0.83, 0.37, 0); g.add(nose);
  [-1, 1].forEach(sz=>{
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), black);
    eye.position.set(0.64, 0.5, sz * 0.15); g.add(eye);
  });
  const spikeGeo = new THREE.ConeGeometry(0.1, 0.4, 6);
  const up = new THREE.Vector3(0, 1, 0);
  const N = 90, ga = Math.PI * (3 - Math.sqrt(5));
  const spikeList = [], mtx = new THREE.Matrix4(), one = new THREE.Vector3(1, 1, 1);
  for(let i=0;i<N;i++){
    const yy = 1 - (i / (N - 1)) * 2, rr = Math.sqrt(1 - yy * yy), th = ga * i;
    const dir = new THREE.Vector3(Math.cos(th) * rr, yy, Math.sin(th) * rr);
    if(dir.x > 0.3 || dir.y < -0.2) continue;     // 顔側と下側には生やさない
    const sg = spikeGeo.clone();
    mtx.compose(new THREE.Vector3(dir.x * 0.6, 0.42 + dir.y * 0.5, dir.z * 0.55),
                new THREE.Quaternion().setFromUnitVectors(up, dir.clone().normalize()), one);
    sg.applyMatrix4(mtx);
    spikeList.push(sg);
  }
  g.add(new THREE.Mesh(mergeGeos(spikeList), spikeMat));
  return g;
}

function mkCanvas(w, h){ const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

function drawFlower(c){
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.fillStyle = "#ffe6f0"; g.fillRect(0, 0, W, H);
  const cols = ["#ff5f9e", "#ff9f45", "#c77dff", "#ff6b6b"];
  const pos = [];
  for(let row=0; row<4; row++) for(let i=0; i<6; i++){
    pos.push([(i + (row % 2 ? 0.5 : 0) + 0.5) * W / 6, H * (0.15 + row * 0.23), cols[(i + row) % 4]]);
  }
  g.fillStyle = "#7cc97a";
  pos.forEach(([x, y])=>{
    g.save(); g.translate(x + W / 12, y + H * 0.06); g.rotate(0.6);
    g.beginPath(); g.ellipse(0, 0, H * 0.055, H * 0.024, 0, 0, Math.PI * 2); g.fill(); g.restore();
  });
  pos.forEach(([x, y, col])=>{
    const r = H * 0.1;
    g.save(); g.translate(x, y); g.fillStyle = col;
    for(let k=0; k<6; k++){
      g.save(); g.rotate(k * Math.PI / 3); g.beginPath();
      g.ellipse(0, -r * 0.62, r * 0.38, r * 0.62, 0, 0, Math.PI * 2); g.fill(); g.restore();
    }
    g.fillStyle = "#ffd23f"; g.beginPath(); g.arc(0, 0, r * 0.34, 0, Math.PI * 2); g.fill();
    g.restore();
  });
}
function drawNeon(c){
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.fillStyle = "#070a1a"; g.fillRect(0, 0, W, H);
  g.strokeStyle = "rgba(80,120,255,.28)"; g.lineWidth = 2;
  for(let i=0; i<=16; i++){ g.beginPath(); g.moveTo(i * W / 16, 0); g.lineTo(i * W / 16, H); g.stroke(); }
  for(let j=0; j<=8; j++){ g.beginPath(); g.moveTo(0, j * H / 8); g.lineTo(W, j * H / 8); g.stroke(); }
  g.lineCap = "round"; g.lineJoin = "round";
  const glow = (color, w, fn)=>{
    g.save(); g.shadowColor = color; g.shadowBlur = 18; g.strokeStyle = color; g.lineWidth = w;
    g.beginPath(); fn(); g.stroke(); g.restore();
  };
  glow("#00f0ff", 8, ()=>{ g.moveTo(0, H * 0.24); g.lineTo(W, H * 0.24); });
  glow("#00f0ff", 8, ()=>{ g.moveTo(0, H * 0.76); g.lineTo(W, H * 0.76); });
  glow("#ff2bd6", 9, ()=>{
    g.moveTo(0, H * 0.62);
    for(let i=1; i<=16; i++) g.lineTo(i * W / 16, H * (i % 2 ? 0.38 : 0.62));
  });
}

  [-1, 1].forEach(sx=>{ g.beginPath(); g.arc(sx * r * 0.78, r * 0.3, r * 0.2, 0, Math.PI * 2); g.fill(); });
  g.lineWidth = r * 0.05; g.strokeStyle = "#2a1a1a";
  [-1, 1].forEach(sx=>{
    g.fillStyle = "#fff"; g.beginPath(); g.arc(sx * r * 0.38, -r * 0.25, r * 0.28, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = "#1a1010"; g.beginPath(); g.arc(sx * r * 0.38 - sx * r * 0.07, -r * 0.25 + r * 0.09, r * 0.12, 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = "#8a1f33";
  g.beginPath(); g.moveTo(-r * 0.62, r * 0.2); g.quadraticCurveTo(0, r * 1.08, r * 0.62, r * 0.2); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = "#ff7a8a";

function drawMelon(c){
  const g = c.getContext("2d"), W = c.width, H = c.height, half = W / 2;
  g.fillStyle = "#52b95b"; g.fillRect(0, 0, half, H);
  g.strokeStyle = "#1e7a30"; g.lineWidth = W * 0.018; g.lineCap = "round";
  for(let k=0; k<8; k++){
    const x0 = (k + 0.5) * half / 8;
    g.beginPath();
    for(let y=0; y<=H; y+=8){
      const x = x0 + Math.sin(y * 0.045 + k * 1.7) * 10;
      if(y === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }
  g.fillStyle = "#ff4f6d"; g.fillRect(half, 0, half, H);
  g.fillStyle = "#f4f1d8"; g.fillRect(half, 0, W * 0.03, H); g.fillRect(W - W * 0.03, 0, W * 0.03, H);
  const r = srand(11);
  g.fillStyle = "#2a1a1a";
  for(let i=0; i<26; i++){
    g.save(); g.translate(half + W * 0.07 + r() * (half - W * 0.14), H * 0.1 + r() * H * 0.8);
    g.rotate(r() * 6.28); g.beginPath(); g.ellipse(0, 0, 9, 5, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }

function drawGalaxy(c){
  const g = c.getContext("2d"), W = c.width, H = c.height, r = srand(7);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "#150b3f"); gr.addColorStop(0.5, "#3a1a7c"); gr.addColorStop(1, "#150b3f");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const neb = ["255,80,200", "80,160,255", "170,90,255", "255,150,90"];
  for(let i=0; i<6; i++){
    const x = r() * W, y = H * (0.25 + r() * 0.5), rad = H * (0.35 + r() * 0.25);
    const rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, "rgba(" + neb[i % 4] + ",.5)"); rg.addColorStop(1, "rgba(" + neb[i % 4] + ",0)");
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  for(let i=0; i<170; i++){
    g.fillStyle = "rgba(255,255,255," + (0.5 + r() * 0.5) + ")";
    g.beginPath(); g.arc(r() * W, r() * H, 0.8 + r() * 2.2, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = "#fff";
  for(let i=0; i<10; i++){
    const x = r() * W, y = H * (0.15 + r() * 0.7), s2 = 7 + r() * 7;
    g.beginPath(); g.moveTo(x, y - s2); g.lineTo(x + s2 * 0.25, y - s2 * 0.25); g.lineTo(x + s2, y);
    g.lineTo(x + s2 * 0.25, y + s2 * 0.25); g.lineTo(x, y + s2); g.lineTo(x - s2 * 0.25, y + s2 * 0.25);
    g.lineTo(x - s2, y); g.lineTo(x - s2 * 0.25, y - s2 * 0.25); g.closePath(); g.fill();
  }
}

}

function rng(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function clearLevel(){
  if(!levelGroup) return;
  scene.remove(levelGroup);
  levelGroup.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach(m=>{ if(m && !m.map) m.dispose(); });
  });
  levelGroup = null;
}

function getPool(n){
  if(n === 1) return ["s","s","slope"];
  if(n === 2) return ["s","curve","slope","curve"];
  let p = ["s","slope","shift","curve"];
  if(n >= 3) p.push("arc");
  if(n >= 4) p = p.concat(["jump","cat"]);
  if(n >= 5) p = p.concat(["bridge","boost"]);
  if(n >= 6) p = p.concat(["spinner","chain"]);
  if(n >= 7) p.push("mover");
  if(n >= 8) p.push("bigjump");
  if(n >= 10) p.push("trampoline");
  if(n >= 12) p.push("ice");
  if(n >= 14) p.push("belt");
  return p;
}

function buildLevel(n){
  clearLevel();
  levelGroup = new THREE.Group();
  scene.add(levelGroup);
  plats = []; blocks = []; gemList = []; spinners = []; pads = []; tiles = []; movers = []; belts = []; cats = [];

  const rand = rng(n * 9973 + 17);
  const th = THEMES[(n - 1) % THEMES.length];
  const trackCol = new THREE.Color(th.t1), trackAlt = new THREE.Color(th.t2);
  scene.background = new THREE.Color(th.bot);
  scene.fog = new THREE.Fog(new THREE.Color(th.fog).getHex(), 30, 95);
  hemi.color.set(th.bot); hemi.color.lerp(new THREE.Color(0xffffff), 0.45);
  hemi.groundColor.setHex(th.hemiG);
  sun.color.setHex(th.lightC);

  let d = 0, cx = 0, cy = 0, flip = false;
  const width = Math.max(5.6, 7.2 - n * 0.2);
  const length = 90 + n * 18;
  railsOn = false;
  const rampCol = new THREE.Color(0xff8a3d);
  const moverCol = new THREE.Color(0xff6b9d);
  const bounceCol = new THREE.Color(0xffa51f);
  const iceCol = new THREE.Color(0xc8f1ff);

  function addPlat(len, w, y0, y1, color, x){
    const p = {d0:d, d1:d+len, cx:x, cx0:x, cx1:x, w, y0, y1, rails:railsOn};
    plats.push(p);
    const slopeLen = Math.hypot(len, y1 - y0);
    const ang = Math.atan2(y1 - y0, len);
    const geo = new THREE.BoxGeometry(w, 0.7, slopeLen);
    const uv = geo.attributes.uv;
    for(let i=0;i<uv.count;i++){ uv.setXY(i, uv.getX(i)*w/1.6, uv.getY(i)*slopeLen/1.6); }
    const m = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({color, map:checkerTex, shininess:20}));
    m.position.set(x, (y0+y1)/2 - 0.35, -(d + len/2));
    m.rotation.x = ang;
    levelGroup.add(m);
    p.mesh = m;
    if(railsOn){
      [-1, 1].forEach(sx=>{
        const r = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, slopeLen),
          new THREE.MeshPhongMaterial({color:0xfff7e8, emissive:0x2a2a2a}));
        r.position.set(x + sx * (w/2 - 0.15), (y0+y1)/2 + 0.35, -(d + len/2));
        r.rotation.x = ang;
        levelGroup.add(r);
      });
    }
    minY = Math.min(minY, y0, y1);
    d += len;
    return p;
  }

  // カーブする道（短い区間をつなげて当たり判定にする）
  function addRibbon(len, w, y0, y1, color, cxFn, wFn){
    const wf = wFn || (() => w);
    const seg = Math.max(2, Math.round(len));
    const pts = [];
    for(let i=0;i<=seg;i++){ const t = i / seg; pts.push({x:cxFn(t), y:y0 + (y1 - y0) * t, d:d + len * t, w:wf(t)}); }
    for(let i=0;i<seg;i++){
      plats.push({d0:pts[i].d, d1:pts[i+1].d, cx:pts[i].x, cx0:pts[i].x, cx1:pts[i+1].x, w:(pts[i].w + pts[i+1].w) / 2,
                  y0:pts[i].y, y1:pts[i+1].y, curve:true, rails:railsOn});
    }
    const P = [], U = [], th2 = 0.7;
    const tri = (a, b2, c2, ua, ub, uc)=>{ P.push(a[0],a[1],a[2], b2[0],b2[1],b2[2], c2[0],c2[1],c2[2]); U.push(ua[0],ua[1], ub[0],ub[1], uc[0],uc[1]); };
    for(let i=0;i<seg;i++){
      const A = pts[i], B = pts[i+1];
      const L0 = [A.x - A.w/2, A.y, -A.d], R0 = [A.x + A.w/2, A.y, -A.d];
      const L1 = [B.x - B.w/2, B.y, -B.d], R1 = [B.x + B.w/2, B.y, -B.d];
      const v0 = A.d / 1.6, v1 = B.d / 1.6, wuA = A.w / 1.6, wuB = B.w / 1.6;
      tri(L0, R0, R1, [0,v0], [wuA,v0], [wuB,v1]);
      tri(L0, R1, L1, [0,v0], [wuB,v1], [0,v1]);
      const L0b = [L0[0], L0[1] - th2, L0[2]], L1b = [L1[0], L1[1] - th2, L1[2]];
      const R0b = [R0[0], R0[1] - th2, R0[2]], R1b = [R1[0], R1[1] - th2, R1[2]];
      tri(L0, L1, L1b, [v0,0], [v1,0], [v1,0.4]);
      tri(L0, L1b, L0b, [v0,0], [v1,0.4], [v0,0.4]);
      tri(R0, R1, R1b, [v0,0], [v1,0], [v1,0.4]);
      tri(R0, R1b, R0b, [v0,0], [v1,0.4], [v0,0.4]);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(P), 3));
    geo.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(U), 2));
    geo.computeVertexNormals();
    levelGroup.add(new THREE.Mesh(geo, new THREE.MeshPhongMaterial({color, map:checkerTex, shininess:20, side:THREE.DoubleSide})));
    if(railsOn){
      const RP = [];
      const rtri = (a, b2, c2)=>{ RP.push(a[0],a[1],a[2], b2[0],b2[1],b2[2], c2[0],c2[1],c2[2]); };
      [-1, 1].forEach(sg=>{
        for(let i=0;i<seg;i++){
          const A = pts[i], B = pts[i+1], h = 0.7;
          const ai = [A.x + sg * (A.w / 2 - 0.3), A.y, -A.d], bi = [B.x + sg * (B.w / 2 - 0.3), B.y, -B.d];
          const ao = [A.x + sg * (A.w / 2), A.y, -A.d], bo = [B.x + sg * (B.w / 2), B.y, -B.d];
          const aiT = [ai[0], ai[1] + h, ai[2]], biT = [bi[0], bi[1] + h, bi[2]];
          const aoT = [ao[0], ao[1] + h, ao[2]], boT = [bo[0], bo[1] + h, bo[2]];
          rtri(ai, bi, biT); rtri(ai, biT, aiT);
          rtri(ao, bo, boT); rtri(ao, boT, aoT);
          rtri(aiT, biT, boT); rtri(aiT, boT, aoT);
        }
      });
      const rg = new THREE.BufferGeometry();
      rg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(RP), 3));
      rg.computeVertexNormals();
      levelGroup.add(new THREE.Mesh(rg, new THREE.MeshPhongMaterial({color:0xfff7e8, emissive:0x2a2a2a, side:THREE.DoubleSide})));
    }
    minY = Math.min(minY, y0, y1);
    const info = {d0:d, d1:d+len, cxFn, y0, y1};
    d += len;
    return info;
  }

  // コイン：金色のまるい板＋少し明るい中央のもり上がり（1つのジオメトリにまとめて軽く）
  const coinGeo = (()=>{
    const parts = [
      [new THREE.CylinderGeometry(0.34, 0.34, 0.1, 28), [1.0, 0.78, 0.24]],
      [new THREE.CylinderGeometry(0.24, 0.24, 0.125, 28), [1.0, 0.9, 0.5]]
    ];
    const pos = [], col = [];
    parts.forEach(([pg, c])=>{
      pg.rotateX(Math.PI / 2);
      const arr = (pg.index ? pg.toNonIndexed() : pg).attributes.position.array;
      for(let i=0;i<arr.length;i+=3){ pos.push(arr[i], arr[i+1], arr[i+2]); col.push(c[0], c[1], c[2]); }
    });
    const cg = new THREE.BufferGeometry();
    cg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
    cg.setAttribute("color", new THREE.BufferAttribute(new Float32Array(col), 3));
    cg.computeVertexNormals();
    return cg;
  })();
  const coinMat = new THREE.MeshPhongMaterial({vertexColors:true, emissive:0x7a5200, shininess:100});
  function addCoin(x, gd, gy){
    const g = new THREE.Mesh(coinGeo, coinMat);
    g.position.set(x, gy, -gd);
    levelGroup.add(g);
    gemList.push({mesh:g, x, d:gd, y:gy, taken:false});
  }
  function addGems(count, p){
    for(let i=0;i<count;i++){
      const t = (i + 0.5) / count;
      addCoin(p.cx, p.d0 + (p.d1 - p.d0) * t, p.y0 + (p.y1 - p.y0) * t + 1.1);
    }
  }
  function addGemsCurve(count, r){
    for(let i=0;i<count;i++){
      const t = (i + 0.5) / count;
      addCoin(r.cxFn(t), r.d0 + (r.d1 - r.d0) * t, r.y0 + (r.y1 - r.y0) * t + 1.1);
    }
  }
  function col(){ flip = !flip; return flip ? trackCol : trackAlt; }

  function addPad(x, d0, d1, w, y){
    const pw = Math.min(w - 0.6, 2.6), len = d1 - d0;
    const t = padTexBase.clone(); t.needsUpdate = true; t.repeat.set(1, Math.max(1, len / 2.2));
    const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, len), new THREE.MeshBasicMaterial({map:t}));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, y + 0.025, -(d0 + d1) / 2);
    levelGroup.add(m);
    pads.push({cx:x, d0, d1, w:pw});
  }
  function addSpinner(x, sd, y, L, omega, phase){
    const grp = new THREE.Group();
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.9, 12), new THREE.MeshPhongMaterial({color:0xfff7e8}));
    post.position.y = 0.45;
    const bar = new THREE.Mesh(new THREE.BoxGeometry(L, 0.5, 0.3), new THREE.MeshPhongMaterial({color:0xff5d6c, emissive:0x40080f}));
    bar.position.y = 0.45;
    grp.add(post, bar);
    const capMat = new THREE.MeshPhongMaterial({color:0xffc83d});
    [-1, 1].forEach(sx=>{
      const cap = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.42), capMat);
      cap.position.set(sx * (L / 2 - 0.25), 0.45, 0); grp.add(cap);
    });
    grp.position.set(x, y, -sd);
    levelGroup.add(grp);
    spinners.push({mesh:grp, x, d:sd, y, L, omega, phase, ang:0});
  }

  const pool = getPool(n);
  const railRand = rng(n * 7919 + 3);
  let railsPrev = false, railsRun = 0;
  const hardTypes = ["jump","chain","bigjump","spinner","mover","trampoline","ice","belt"];
  let prevHard = false;

  minY = 0;
  addPlat(14, width, 0, 0, trackCol, 0);
  // START ライン＆文字
  const startLine = new THREE.Mesh(new THREE.PlaneGeometry(width, 0.35),
    new THREE.MeshBasicMaterial({color:0x2fd16b}));
  startLine.rotation.x = -Math.PI / 2;
  startLine.position.set(0, 0.02, -3.0);
  levelGroup.add(startLine);
  levelGroup.add(floorPlane(makeTextTex("START", 512, 160, "#ffffff", null, "#1f9a4d"), 4.6, 1.44, 0, 0, 6.2));

  const smooth = t => t * t * (3 - 2 * t);

  while(d < length){
    let type = pool[Math.floor(rand() * pool.length)];
    if(d < 45) prevHard = true;                       // 最初の45mはやさしく
    if(prevHard){                                      // むずかしい区間のあとは、一息つける区間にする
      for(let tries = 0; tries < 10 && hardTypes.indexOf(type) >= 0; tries++) type = pool[Math.floor(rand() * pool.length)];
    }
    prevHard = hardTypes.indexOf(type) >= 0;
    // ときどきガードレール付きの区間にする（レベル1〜2は全部ガードレール）
    // ガードレールは「落ちやすそうな場所」だけに、ときどき（何もない道には付けない）
    const railP = {curve:0.4, arc:0.5, shift:0.35, cat:0.4, slope:0.3, spinner:0.4}[type] || 0;
    const railF = n <= 9 ? 1 : n <= 14 ? 0.6 : 0.3;
    railsOn = railRand() < railP * railF;
    if(type === "s"){
      const p = addPlat(9 + rand()*5, width, cy, cy, col(), cx);
      addGems(3, p);
    } else if(type === "shift"){
      const dir = rand() < 0.5 ? -1 : 1;
      const x0 = cx, x1 = Math.max(-3.5, Math.min(3.5, cx + dir * (1.8 + rand()*1.7)));
      const r = addRibbon(18 + rand()*4, width, cy, cy, col(), t => x0 + (x1 - x0) * smooth(t));
      cx = x1;
      addGemsCurve(3, r);
    } else if(type === "curve"){
      const waves = n >= 8 ? 2 : 1;
      const len = waves === 2 ? 60 : (n <= 3 ? 38 : 34);
      const amp = Math.min(1.4 + n * 0.05, 1.9) * (rand() < 0.5 ? -1 : 1);
      const x0 = cx;
      const r = addRibbon(len, width, cy, cy, col(), t => x0 + amp * Math.sin(t * Math.PI * 2 * waves),
                          t => width + 0.8 * Math.min(1, Math.min(t, 1 - t) / 0.12));
      addGemsCurve(waves === 2 ? 10 : 7, r);
    } else if(type === "slope"){
      const mag = 1.2 + Math.min(n, 4) * 0.25;
      const dy = rand() < 0.5 ? -mag * 1.3 : mag;
      const p = addPlat(12, width, cy, cy + dy, col(), cx);
      cy += dy;
      addGems(4, p);
      addPlat(7, width, cy, cy, col(), cx);
    } else if(type === "bridge"){
      const p = addPlat(11, Math.max(2.6, width * 0.5), cy, cy, col(), cx);
      addGems(4, p);
    } else if(type === "boost"){
      const p = addPlat(14, width, cy, cy, col(), cx);
      p.noMob = true;
      addPad(cx, p.d0 + 3, p.d0 + 8, width, cy);
      addGems(3, p);
    } else if(type === "spinner"){
      const w2 = Math.max(6.4, width);
      addPlat(6, width, cy, cy, col(), cx).noMob = true;
      const p = addPlat(12, w2, cy, cy, col(), cx);
      p.noMob = true;
      const L = Math.min(4.0 + (n - 6) * 0.3, 5.2);
      const omega = (1.6 + Math.min(n - 6, 4) * 0.12) * (rand() < 0.5 ? -1 : 1);
      addSpinner(cx, (p.d0 + p.d1) / 2, cy, L, omega, rand() * 6.28);
      addCoin(cx - 2.7, p.d0 + 3, cy + 1.1); addCoin(cx + 2.7, p.d0 + 9, cy + 1.1);
      addPlat(5, width, cy, cy, col(), cx).noMob = true;
    } else if(type === "mover"){
      // 前後に動く道：切れ目の間を行ったり来たりする足場に乗って渡る
      const count = n >= 12 ? 2 : 1;
      const lp = addPlat(5, width, cy, cy, col(), cx); lp.noMob = true; lp.wait = true;   // 足場を待てる場所
      for(let i=0;i<count;i++){
        const mlen = 5.0, amp = 1.8;
        const gapStart = d, gap = mlen + 2 * amp;
        const base0 = gapStart + amp;
        d = base0;
        const p = addPlat(mlen, width, cy, cy, moverCol, cx);
        p.noMob = true;
        p.move = {base0, len:mlen, amp, speed:Math.min(1.0 + (n - 7) * 0.04, 1.3), phase:rand() * 6.28, off:0, dd:0};
        movers.push(p);
        d = gapStart + gap;
        addCoin(cx, gapStart + gap / 2, cy + 1.5);
        const ep = addPlat(4, width, cy, cy, col(), cx); ep.noMob = true; ep.wait = true;
      }
    } else if(type === "arc"){
      // 大きく曲がる道（半円のようにふくらんで、もとの位置にもどる）
      const amp = (4.5 + Math.min(n * 0.2, 1.5)) * (rand() < 0.5 ? -1 : 1);
      const x0 = cx;
      const r = addRibbon(40, width, cy, cy, col(), t => x0 + amp * Math.sin(t * Math.PI),
                          t => width + 0.8 * Math.min(1, Math.min(t, 1 - t) / 0.12));
      addGemsCurve(8, r);
    } else if(type === "railed"){
      // ガードレール付きの直線
      railsOn = true;
      const p = addPlat(14, width, cy, cy, col(), cx);
      addGems(4, p);
    } else if(type === "cat"){
      // 猫のいる道：通りがかると、ちょんとつついてくる
      const p = addPlat(13 + rand() * 3, width, cy, cy, col(), cx);
      addGems(3, p);
      const side = rand() < 0.5 ? -1 : 1;
      const mesh = buildCat(-side);
      const cxp = p.cx + side * p.w * 0.22, dd = (p.d0 + p.d1) / 2;
      mesh.position.set(cxp, p.y0, -dd);
      levelGroup.add(mesh);
      cats.push({mesh, arm:mesh.userData.arm, paw:mesh.userData.paw, arm2:mesh.userData.arm2, tail:mesh.userData.tail, x:cxp, bx:cxp, d:dd, y:p.y0, sx:-side, t:-1, cd:rand() * 0.6, hit:false});
      p.mobUsed = true;
    } else if(type === "trampoline"){
      // トランポリン：踏むと高く跳ね上がり、大きな切れ目を飛び越える
      addPlat(8, width, cy, cy, col(), cx).noMob = true;
      const tp = addPlat(2, width, cy, cy, bounceCol, cx);
      tp.bounce = true; tp.noMob = true;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(Math.min(width / 2 - 0.4, 0.85), 0.1, 8, 28),
        new THREE.MeshPhongMaterial({color:0xffffff}));
      ring.rotation.x = Math.PI / 2;
      ring.position.set(cx, cy + 0.06, -(tp.d0 + tp.d1) / 2);
      levelGroup.add(ring);
      const gap = 3.6 + Math.min((n - 10) * 0.1, 0.6) + rand() * 0.5;
      addCoin(cx, tp.d1 + gap * 0.25, cy + 2.2);
      addCoin(cx, tp.d1 + gap * 0.5, cy + 3.0);
      addCoin(cx, tp.d1 + gap * 0.75, cy + 2.2);
      d += gap;
      addPlat(10, width, cy, cy, col(), cx).noMob = true;
    } else if(type === "ice"){
      // こおりの道：すべりやすく、止まりにくい
      addPlat(5, width, cy, cy, col(), cx).noMob = true;
      const ip = addPlat(14, width, cy, cy, iceCol, cx);
      ip.ice = true; ip.noMob = true;
      for(let i=0;i<5;i++){
        const side = (i % 2 ? 1 : -1) * Math.max(0, width / 2 - 0.9);
        addCoin(cx + side, ip.d0 + 1.5 + i * 2.6, cy + 1.1);
      }
      addPlat(4, width, cy, cy, col(), cx).noMob = true;
    } else if(type === "belt"){
      // 逆走ベルト：手前に流されるので、強く押して進む
      addPlat(5, width, cy, cy, col(), cx).noMob = true;
      const bp = addPlat(12, width, cy, cy, col(), cx);
      bp.belt = true; bp.noMob = true;
      const bt = beltTexBase.clone(); bt.needsUpdate = true; bt.repeat.set(1, -Math.max(1, 12 / 2.2));
      const bm = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(width - 0.5, 3.2), 12), new THREE.MeshBasicMaterial({map:bt}));
      bm.rotation.x = -Math.PI / 2;
      bm.position.set(cx, cy + 0.025, -(bp.d0 + bp.d1) / 2);
      levelGroup.add(bm);
      belts.push(bt);
      addGems(4, bp);
      addPlat(4, width, cy, cy, col(), cx).noMob = true;
    } else if(type === "chain"){
      addPlat(6, width, cy, cy, col(), cx).noMob = true;
      for(let i=0;i<3;i++){
        addPlat(5, width, cy, cy + 1.3, rampCol, cx).noMob = true;
        d += 1.4 + rand() * 0.3;
        const p = addPlat(6.5, width, cy, cy, col(), cx);
        p.noMob = true;
        addCoin(cx, p.d0 - 1.1, cy + 1.9);
      }
    } else if(type === "bigjump"){
      const run = addPlat(8, width, cy, cy, col(), cx);
      run.noMob = true;
      addPad(cx, run.d0 + 3, run.d0 + 8, width, cy);
      addPlat(6, width, cy, cy + 1.2, rampCol, cx).noMob = true;
      d += 4.0 + Math.min((n - 8) * 0.3, 0.9) + rand() * 0.4;
      const p = addPlat(12, width, cy, cy, col(), cx);
      p.noMob = true;
      addCoin(cx, p.d0 - 2.4, cy + 2.6);
    } else {                             // ジャンプ台
      const run = addPlat(8, width, cy, cy, col(), cx);
      run.noMob = true;
      addPad(cx, run.d0 + 2, run.d0 + 6.5, width, cy);   // 助走を助けるブースト板
      addPlat(6, width, cy, cy + 1.5, rampCol, cx).noMob = true;
      d += 1.6 + Math.min(n * 0.05, 0.5) + rand() * 0.3;
      const p = addPlat(11, width, cy, cy, col(), cx);
      p.noMob = true;
      addCoin(cx, p.d0 - 1.1, cy + 2.4);
    }

    // 動く障害物（レベル3から）
    if(n >= 3 && rand() < 0.35 && plats.length > 3){
      const last = plats[plats.length - 1];
      if(!last.curve && !last.tile && !last.noMob && !last.mobUsed && Math.abs(last.y1 - last.y0) < 0.01 && Math.abs(last.w - width) < 0.01){
        const bw = 1.3;
        const amp = last.w / 2 - bw / 2;
        const mesh = buildHedgehog();
        levelGroup.add(mesh);
        blocks.push({
          mesh, cx:last.cx, amp, bw,
          d:(last.d0 + last.d1)/2, y:last.y0,
          speed:0.8 + rand()*0.6 + n*0.05, phase:rand()*6.28
        });
        last.mobUsed = true;
      }
    }
    // つついてくる猫（レベル4から）
    if(n >= 4 && rand() < 0.3 && plats.length > 3){
      const last = plats[plats.length - 1];
      if(!last.curve && !last.move && !last.noMob && !last.mobUsed && !last.ice && !last.belt &&
         Math.abs(last.y1 - last.y0) < 0.01 && Math.abs(last.w - width) < 0.01){
        const side = rand() < 0.5 ? -1 : 1;           // 猫がいる側
        const mesh = buildCat(-side);                  // 手は道の中央に向かって伸びる
        const cxp = last.cx + side * last.w * 0.22, dd = (last.d0 + last.d1) / 2;
        mesh.position.set(cxp, last.y0, -dd);
        levelGroup.add(mesh);
        cats.push({mesh, arm:mesh.userData.arm, paw:mesh.userData.paw, arm2:mesh.userData.arm2, tail:mesh.userData.tail, x:cxp, bx:cxp, d:dd, y:last.y0, sx:-side, t:-1, cd:rand() * 0.6, hit:false});
        last.mobUsed = true;
      }
    }
  }

  // ゴール
  railsOn = false;
  const fin = addPlat(14, 6, cy, cy, new THREE.Color(0xffd34d), cx);
  finishD = fin.d0 + 3;
  const chk = makeCanvasTex((g,s2)=>{
    g.fillStyle="#fff"; g.fillRect(0,0,s2,s2);
    g.fillStyle="#222"; g.fillRect(0,0,s2/2,s2/2); g.fillRect(s2/2,s2/2,s2/2,s2/2);
  }, 64);
  chk.repeat.set(10, 2);
  const finLine = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.2), new THREE.MeshBasicMaterial({map:chk}));
  finLine.rotation.x = -Math.PI / 2;
  finLine.position.set(cx, cy + 0.02, -finishD);
  levelGroup.add(finLine);
  levelGroup.add(floorPlane(makeTextTex("GOAL", 512, 160, "#ff3b55", null, "#ffffff"), 4.6, 1.44, cx, cy, finishD - 1.8));
  const pillarMat = new THREE.MeshPhongMaterial({color:0xfff7e8});
  [-3.3, 3.3].forEach(sx=>{
    const pl = new THREE.Mesh(new THREE.BoxGeometry(0.45, 4.8, 0.45), pillarMat);
    pl.position.set(cx + sx, cy + 2.4, -finishD);
    levelGroup.add(pl);
  });
  const baseMat = new THREE.MeshPhongMaterial({color:0xff3b55});
  const bannerMats = [baseMat, baseMat, baseMat, baseMat,
    new THREE.MeshBasicMaterial({map:makeTextTex("GOAL", 512, 160, "#ffffff", "#ff3b55", null)}), baseMat];
  const banner = new THREE.Mesh(new THREE.BoxGeometry(6.9, 1.5, 0.3), bannerMats);
  banner.position.set(cx, cy + 4.6, -finishD);
  levelGroup.add(banner);

  // 背景（空・雲・うかぶ島）
  buildScenery(levelGroup, th, rand, d);
  $("lv").textContent = "Lv " + n;
}

let gSlope = 0;
function groundAt(x, d){
  let best = null; gSlope = 0; gPlat = null;
  for(let i=0;i<plats.length;i++){
    const p = plats[i];
    if(d < p.d0 || d > p.d1) continue;
    if(p.tile && !p.tile.solid) continue;
    const tt = (d - p.d0) / (p.d1 - p.d0);
    const pcx = p.cx0 + (p.cx1 - p.cx0) * tt;
    if(Math.abs(x - pcx) <= p.w/2 + 0.12){
      const h = p.y0 + (p.y1 - p.y0) * (d - p.d0) / (p.d1 - p.d0);
      if(best === null || h > best){ best = h; gPlat = p; gSlope = (p.y1 - p.y0) / (p.d1 - p.d0); }
    }
  }
  return best;
}

/* ---------- 入力（指で転がす） ---------- */
const keys = {left:false, right:false, up:false, down:false};
const KEYMAP = {ArrowLeft:"left", a:"left", ArrowRight:"right", d:"right", ArrowUp:"up", w:"up", ArrowDown:"down", s:"down"};
let kbYaw = 0;
window.addEventListener("keydown", e=>{
  if(KEYMAP[e.key]){
    if(!(keys.left || keys.right || keys.up || keys.down)) kbYaw = camYaw;   // 押し始めの向きを基準にする
    keys[KEYMAP[e.key]] = true;
  }
});
window.addEventListener("keyup", e=>{ if(KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });

const MAXR = 70;                 // 最大入力になる指の移動量(px)
const stick = $("stick"), knob = $("knob");
const touch = {on:false, ox:0, oy:0, x:0, y:0};
function setTouch(cx, cy){
  let dx = cx - touch.ox, dy = cy - touch.oy;
  const len = Math.hypot(dx, dy);
  if(len > MAXR){                // 指がはみ出したら基準点が追従
    touch.ox += dx * (len - MAXR) / len;
    touch.oy += dy * (len - MAXR) / len;
    dx = cx - touch.ox; dy = cy - touch.oy;
  }
  touch.x = dx / MAXR; touch.y = -dy / MAXR;
  stick.style.left = touch.ox + "px"; stick.style.top = touch.oy + "px";
  knob.style.transform = "translate(" + dx * 0.6 + "px," + dy * 0.6 + "px)";
}
window.addEventListener("pointerdown", e=>{
  if(e.target.closest && e.target.closest("#overlay, #snd, #settings, #choice")) return;
  touch.on = true; touch.ox = e.clientX; touch.oy = e.clientY; touch.yaw = camYaw;
  touch.x = touch.y = 0;
  // 操作の目印（白い輪と黄色い丸）は表示しない
  setTouch(e.clientX, e.clientY);
});
window.addEventListener("pointermove", e=>{ if(touch.on) setTouch(e.clientX, e.clientY); });
function endTouch(){ touch.on = false; touch.x = touch.y = 0; stick.style.display = "none"; }
window.addEventListener("pointerup", endTouch);
window.addEventListener("pointercancel", endTouch);

function rotIn(ix, iy, phi){
  const c = Math.cos(phi), s = Math.sin(phi);
  return {x: ix * c + iy * s, y: -ix * s + iy * c};
}
function readInput(){
  let kx = 0, ky = 0;
  if(keys.left) kx -= 1; if(keys.right) kx += 1;
  if(keys.up) ky += 1; if(keys.down) ky -= 1;
  // 指を置いたときのカメラの向きを基準にして、「上＝いま見えている奥」になる
  const t = rotIn(touch.x, touch.y, touch.yaw || 0), k = rotIn(kx, ky, kbYaw);
  let ix = t.x + k.x, iy = t.y + k.y;
  const l = Math.hypot(ix, iy);
  if(l > 1){ ix /= l; iy /= l; }
  return {x:ix, y:iy};
}

try{ const sv = parseInt(localStorage.getItem("rb_lives") || "", 10); if(sv >= 1 && sv <= MAX_LIVES) lives = sv; }catch(e){}
function saveLives(){ save("rb_lives", String(lives)); }
const HEART = '<svg class="hrt" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
function renderLives(){
  let h = "";
  for(let i=0; i<MAX_LIVES; i++) h += HEART.replace('class="hrt"', 'class="hrt' + (i < lives ? '' : ' off') + '"');
  $("lifeChip").innerHTML = h;
}
function respawn(){                       // 落ちる前の安全な場所から、もう一度
  const tr = b.trail || [];
  let sp = {x:0, d:3, y:0};
  let waitMode = false;
  if(tr.length){
    const ref = tr[tr.length - 1].d;
    // 同じ場所で続けて落ちたら、さらに手前から（9m → 15m → 21m …）
    const near = Math.abs(ref - (b.lastRef === undefined ? -999 : b.lastRef)) < 16;
    b.back = near ? Math.min(33, (b.back || 9) + 6) : 9;
    b.lastRef = ref;
    sp = tr[0];
    for(let i = tr.length - 1; i >= 0; i--){ if(tr[i].d <= ref - b.back){ sp = tr[i]; break; } }
    const lastE = tr[tr.length - 1];
    if(lastE.wait){                      // 動く足場の手前：待てる場所に、止まった状態でもどる
      waitMode = true;
      sp = {x:lastE.x, d:lastE.pd0 + 1.0, y:lastE.y, wait:true, pd0:lastE.pd0};
    }
  }
  b.x = sp.x; b.d = sp.d; b.y = sp.y; b.vx = 0; b.vy = 0; b.vd = waitMode ? 0 : 6;
  b.grounded = true; b.boost = 0; b.fell = false; b.declined = false; b.inv = 2; camYaw = 0;
  b.trail = tr.length ? tr.filter(e => e.d <= sp.d + 0.01) : [sp];
  if(!b.trail.length) b.trail = [sp];
  b.trailT = 0;
  ballMesh.scale.setScalar(1); ballMesh.visible = true;
  state = "playing";
  toast("GO!");
}
function loseLife(cause){
  if(state !== "playing") return;
  lives--; saveLives(); renderLives();
  const chip = $("lifeChip"); chip.classList.remove("pulse"); void chip.offsetWidth; chip.classList.add("pulse");
  if(lives > 0) toast("MISS!  " + lives + (lives === 1 ? " life left" : " lives left"));
  die(lives > 0);                         // 残っていれば、いつもの演出のあとで、落ちる直前から再開
}
function openChoice(){
  state = "choice";
  endTouch();
  $("chN").textContent = rescues;
  $("choice").style.display = "flex";
}
function closeChoice(){ $("choice").style.display = "none"; }
$("chUse").addEventListener("click", ()=>{ closeChoice(); useRescue(); });
$("chNo").addEventListener("click", ()=>{ closeChoice(); b.declined = true; state = "playing"; });
function useRescue(){
  rescues--; save("rb_rescue", String(rescues)); updateRescueHud();
  const tr = b.trail || [];
  const sp = tr.length ? tr[Math.max(0, tr.length - 10)] : {x:0, d:3, y:0};
  resc = {t:0, sx:b.x, sy:b.y, sd:b.d, tx:sp.x, ty:sp.y, td:sp.d, vy0:Math.min(b.vy, -2)};
  state = "rescue";                       // とりが来て、ボールをつかんで運ぶ
  b.vx = 0; b.vd = 0; b.grounded = false; b.fell = false;   // つかまれるまでは、ボールは落ち続ける
  ballMesh.visible = true;
  birdExit = null;
  bird.visible = true;
  bird.rotation.set(-0.25, Math.PI, 0);          // 顔をカメラに向ける
  bird.position.set(b.x + 4, b.y + 14, -(b.d + 6));
  playRescue();
}
function fallScale(){
  return Math.max(0.04, 1 - Math.max(0, (b.gy || 0) - 2.5 - b.y) / 45);
}
function die(retry){
  if(state !== "playing") return;
  state = "dead"; deadTimer = 0; b.retry = !!retry;
  b.fell = !b.grounded && b.y < (b.gy || 0) - 2;   // 落下でのミスか、障害物でのミスか
  if(!b.fell) b.vy = 0;
  if(!retry){ gems = 0; $("gm").textContent = bank; }   // 本当のゲームオーバーで、そのステージのコインはすべてリセット
  playMiss();
}

function update(dt){
  time += dt;

  // ブロック・ジェムのアニメーション
  blocks.forEach(k=>{
    const ph = time * k.speed + k.phase;
    const bx = k.cx + Math.sin(ph) * k.amp;
    k.bx = bx;
    const target = Math.cos(ph) >= 0 ? 0 : Math.PI;   // 進む方向を向く
    const cur = k.ry || 0;
    const diff = ((target - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    k.ry = cur + diff * Math.min(1, dt * 10);
    k.mesh.rotation.y = k.ry;
    k.mesh.position.set(bx, k.y + Math.abs(Math.sin(time * 9 + k.phase)) * 0.07, -k.d);
  });
  gemList.forEach(g=>{ if(!g.taken){ g.mesh.rotation.y += dt * 2.5; } });
  spinners.forEach(sp=>{ sp.ang = sp.omega * time + sp.phase; sp.mesh.rotation.y = sp.ang; });
  belts.forEach(t=>{ t.offset.y -= dt * 0.8; });
  cats.forEach(c=>{
    c.cd -= dt;
    const near = state === "playing" && Math.abs(b.d - c.d) < 7 && Math.abs(b.x - c.bx) < 5.5;
    // ボールをおいかけて、横にすべるようについていく
    const tx = near ? c.bx + Math.max(-1.1, Math.min(1.1, (b.x - c.bx) * 0.7)) : c.bx;
    const px = c.x; c.x += (tx - c.x) * Math.min(1, dt * 5);
    const hop = Math.min(1, Math.abs(c.x - px) / Math.max(dt, 1e-3) / 1.5);   // 動いているときはぴょんぴょん
    const ahead = (c.d - 0.3) - b.d;               // ボールが通りあわせるタイミングをねらってつつく
    if(near && c.t < 0 && c.cd <= 0 && ahead > -0.6 && ahead < Math.max(1.2, b.vd * 0.31 + 0.7) && Math.abs(b.x - c.x) < 2.4){ c.t = 0; c.hit = false; c.cd = 0.8; }
    if(c.t >= 0){ c.t += dt; if(c.t >= 0.45) c.t = -1; }
    const u2 = c.t >= 0 ? c.t / 0.45 : 0;
    // いったん手を引いて（メタメタのめとめ）、すばやくつつく
    const pulse = c.t < 0 ? 0 : (u2 < 0.3 ? -0.45 * Math.sin(Math.PI * u2 / 0.3) : Math.sin(Math.PI * (u2 - 0.3) / 0.7));
    c.pulse = pulse;
    const ext = Math.max(0, pulse);
    c.arm.rotation.z = c.sx * (0.12 + 1.38 * pulse);
    c.arm.scale.y = 1 + 0.45 * ext; c.paw.scale.y = 1 / c.arm.scale.y;   // つくときは手がのびる
    c.arm2.rotation.z = -c.sx * (0.12 + 0.08 * Math.sin(time * 3 + c.bx) + 0.25 * ext);
    c.tail.rotation.z = Math.sin(time * 5 + c.bx) * 0.5;
    // ボールの方を向く・からだをのばす・いきいきした動き
    const look = near ? Math.max(-0.5, Math.min(0.5, Math.atan2(b.x - c.x, Math.max(0.5, c.d - b.d)))) : 0;
    c.mesh.rotation.y += (look - c.mesh.rotation.y) * Math.min(1, dt * 6);
    c.mesh.rotation.z = -c.sx * 0.12 * Math.max(0, pulse);
    c.mesh.position.x = c.x;
    c.mesh.position.y = c.y + hop * Math.abs(Math.sin(time * 14)) * 0.18 + (near ? Math.abs(Math.sin(time * 7)) * 0.04 : 0);
    c.mesh.scale.y = 1 + Math.sin(time * 3 + c.bx) * 0.025 + (u2 > 0 && u2 < 0.3 ? 0.06 : 0);
  });
  movers.forEach(p=>{
    const mv = p.move, off = mv.amp * Math.sin(time * mv.speed + mv.phase);
    mv.dd = off - mv.off; mv.off = off;
    p.d0 = mv.base0 + off; p.d1 = p.d0 + mv.len;
    p.mesh.position.z = -(p.d0 + mv.len / 2);
  });
  tiles.forEach(p=>{
    const c = (time + p.tile.phase) % p.tile.period;
    p.tile.solid = c < p.tile.on;
    p.mesh.visible = p.tile.solid;
    const warn = c > p.tile.on - 0.7 && c < p.tile.on;
    p.mesh.material.emissive.setHex(warn && (Math.floor(time * 14) % 2) ? 0xaa3322 : 0x000000);
  });

  if(state === "playing"){
    const A = 11, C = 1.1, SLOPE_G = 15;
    const inp = readInput();
    const g0 = groundAt(b.x, b.d);
    const slope = g0 === null ? 0 : gSlope;
    if(b.grounded && gPlat && gPlat.move) b.d += gPlat.move.dd;   // 動く道に乗っていたら一緒に運ばれる
    const onG = b.grounded;
    const onIce = onG && gPlat && gPlat.ice;
    const ctrl = onG ? (onIce ? 0.35 : 1) : 0.2;
    const drag = onG ? (onIce ? 0.35 : C) : 0.15;

    let ax = inp.x * A * ctrl - drag * b.vx;
    let ad = inp.y * A * ctrl - drag * b.vd;
    if(onG) ad -= SLOPE_G * slope;      // 坂道：上りは減速、下りは加速
    if(onG && gPlat && gPlat.belt) ad -= 6;      // 逆走ベルト
    // ブースト板
    const padOn = onG && pads.some(p => b.d >= p.d0 && b.d <= p.d1 && Math.abs(b.x - p.cx) < p.w / 2 + 0.2);
    if(padOn){ b.boost = 1.4; ad += 34; }
    b.boost = Math.max(0, (b.boost || 0) - dt);
    b.vx += ax * dt; b.vd += ad * dt;
    const sp = Math.hypot(b.vx, b.vd);
    const cap = (b.boost || 0) > 0 ? 22 : 16;
    if(sp > cap){ b.vx *= cap / sp; b.vd *= cap / sp; }

    const px = b.x, pd = b.d;
    b.x += b.vx * dt;
    b.d += b.vd * dt;

    // スタート地点の後ろ壁
    if(b.d < 0.6){ b.d = 0.6; if(b.vd < 0) b.vd = 0; }
    // 初級レベルのガードレール
    {
      const p = plats.find(q => b.d >= q.d0 && b.d <= q.d1);
      if(p && p.rails){
        const lim = p.w / 2 - R - 0.3;
        const pc = p.cx0 + (p.cx1 - p.cx0) * ((b.d - p.d0) / (p.d1 - p.d0));
        if(b.x > pc + lim){ b.x = pc + lim; if(b.vx > 0) b.vx *= -0.3; }
        if(b.x < pc - lim){ b.x = pc - lim; if(b.vx < 0) b.vx *= -0.3; }
      }
    }

    // 縦方向
    const g = groundAt(b.x, b.d);
    if(b.grounded && gPlat && gPlat.bounce){ b.grounded = false; b.vy = 12; b.y += 0.02; playBoing(); }   // トランポリン
    if(b.grounded){
      if(g !== null && g >= b.y - 0.35){
        b.vy = Math.max(-14, Math.min(9, (g - b.y) / dt));
        b.y = g;
      } else {
        b.grounded = false;
      }
    }
    if(!b.grounded){
      const py = b.y;
      b.vy -= GRAV * dt;
      b.y += b.vy * dt;
      // 下から突き抜けて着地しない（上から落ちてきたときだけ着地）
      if(g !== null && b.y <= g && py >= g - 0.3 && b.vy <= 0){ b.y = g; b.grounded = true; b.vy = 0; }
    }

    // 落ちていくときはだんだん小さくなる
    if(b.grounded){ b.gy = b.y; b.declined = false; }
    // 助けが必要なときに戻る場所を、少しずつ記録しておく
    b.trailT = (b.trailT || 0) + dt;
    if(b.grounded && b.trailT > 0.15 && gPlat && !gPlat.move && !gPlat.bounce && !gPlat.ice && !gPlat.belt && Math.abs(gPlat.y1 - gPlat.y0) < 0.01){
      b.trailT = 0;
      const tt2 = (b.d - gPlat.d0) / (gPlat.d1 - gPlat.d0);
      (b.trail = b.trail || []).push({x:gPlat.cx0 + (gPlat.cx1 - gPlat.cx0) * tt2, d:b.d, y:b.y, wait:!!gPlat.wait, pd0:gPlat.d0});
      if(b.trail.length > 60) b.trail.shift();
    }
    if((b.inv || 0) > 0){
      b.inv -= dt;
      ballMesh.visible = true;                      // 点滅はさせない（もどった直後は敵に当たらないだけ）
    }
    const fdepth = (b.gy || 0) - 2.5 - b.y;
    ballMesh.scale.setScalar(!b.grounded && (g === null || b.y < g - 0.4) && fdepth > 0 ? Math.max(0.04, 1 - fdepth / 45) : 1);

    // 回転
    ballMesh.rotateOnWorldAxis(xAxis, -(b.d - pd) / R);
    ballMesh.rotateOnWorldAxis(zAxis, -(b.x - px) / R);

    // ジェム
    gemList.forEach(gm=>{
      if(gm.taken) return;
      if(Math.abs(gm.d - b.d) < 1 && Math.abs(gm.x - b.x) < 1 && Math.abs(gm.y - (b.y + R)) < 1.1){
        gm.taken = true; gm.mesh.visible = false; gems++;
        $("gm").textContent = bank + gems; playCoin();
      }
    });

    // 回転バー（当たると弾き飛ばされる）
    for(const sp of spinners){
      const ca = Math.cos(sp.ang), sa = Math.sin(sp.ang), h = sp.L / 2;
      const rx = b.x - sp.x, rd = b.d - sp.d;
      const tproj = Math.max(-h, Math.min(h, rx * ca + rd * sa));
      const px2 = sp.x + ca * tproj, pd2 = sp.d + sa * tproj;
      let nx = b.x - px2, nd = b.d - pd2;
      const dist = Math.hypot(nx, nd);
      if(dist < R + 0.16 && b.y < sp.y + 0.7 && b.y + R * 2 > sp.y){
        if(dist < 1e-4){ nx = -sa; nd = ca; } else { nx /= dist; nd /= dist; }
        const pen = R + 0.16 - dist;
        b.x += nx * pen; b.d += nd * pen;
        const bvx = -sp.omega * (pd2 - sp.d), bvd = sp.omega * (px2 - sp.x);
        const rvn = (b.vx - bvx) * nx + (b.vd - bvd) * nd;
        if(rvn < 0){ b.vx -= 1.6 * rvn * nx; b.vd -= 1.6 * rvn * nd; }
        b.vx += bvx * 0.35; b.vd += bvd * 0.35;
      }
    }

    // 猫（体はやわらかく押し出し、手でちょんと軽くつつく）
    for(const c of cats){
      const nx = b.x - c.x, nd = b.d - c.d, dist = Math.hypot(nx, nd);
      if(dist < R + 0.5 && b.y < c.y + 0.9 && b.y + R * 2 > c.y){
        const ux = dist > 1e-4 ? nx / dist : -c.sx, ud = dist > 1e-4 ? nd / dist : 0;
        const pen = R + 0.5 - dist; b.x += ux * pen; b.d += ud * pen;
        const vn = b.vx * ux + b.vd * ud;
        if(vn < 0){ b.vx -= 1.3 * vn * ux; b.vd -= 1.3 * vn * ud; }
      }
      if(c.t >= 0 && !c.hit){
        const u = c.t / 0.45;
        if(u > 0.5 && u < 0.85){
          const th = c.sx * (0.12 + 1.38 * (c.pulse || 0));
          const L = 0.46 * (1 + 0.45 * Math.max(0, c.pulse || 0));
          const tipx = c.x + c.sx * 0.4 + Math.sin(th) * L, tipy = c.y + 0.66 - Math.cos(th) * L;
          if(Math.hypot(b.x - tipx, (b.y + R) - tipy, b.d - (c.d - 0.3)) < R + 0.45){
            c.hit = true;
            b.vx += c.sx * 1.4; b.vd += 0.4;
            playPoke();
          }
        }
      }
    }

    // 障害物
    for(const k of blocks){
      if((b.inv || 0) <= 0 && Math.abs(k.d - b.d) < 0.45 + R * 0.6 &&
         Math.abs(k.bx - b.x) < k.bw/2 + R * 0.6 &&
         b.y < k.y + 0.9 && b.y + R * 2 > k.y){
        loseLife("hit"); break;
      }
    }

    const falling = !b.grounded && b.vy < 0 && (g === null || b.y < g - 0.4);
    if(falling && rescues > 0 && !b.declined && b.y < (b.gy || 0) - 6){ openChoice(); }   // 助けを使うか選ぶ
    else if(b.y < Math.max(minY - 8, (b.gy || 0) - 12)) loseLife("fall");

    // ゴール
    $("fill").style.width = Math.max(0, Math.min(100, (b.d / finishD) * 100)) + "%";
    if(b.d >= finishD){
      state = "clear";
      endTouch();
      recordClear();
      playClear(); show("CLEAR!", "", "NEXT");
    }
  } else if(state === "rescue"){
    resc.t += dt;
    const t = resc.t, TA = 0.7, TB = 1.5, TC = 0.6, HANG = 1.95;
    const cY = resc.sy + resc.vy0 * 0.6 * TA - 6 * TA * TA;      // つかまれるときのボールの高さ
    const ease = u => u * u * (3 - 2 * u);
    if(t < TA){                                          // とりが飛んできてつかむ
      const e = ease(t / TA);
      b.x = resc.sx; b.d = resc.sd;
      b.y = resc.sy + resc.vy0 * 0.6 * t - 6 * t * t;            // ボールは落ち続け、鳥がおいかけてつかむ
      bird.position.set(resc.sx + (1 - e) * 4, (resc.sy + 14) * (1 - e) + (b.y + HANG) * e, -(resc.sd + (1 - e) * 6));
    } else if(t < TA + TB){                              // もちあげて運ぶ
      const e = ease((t - TA) / TB);
      b.x = resc.sx + (resc.tx - resc.sx) * e;
      b.d = resc.sd + (resc.td - resc.sd) * e;
      ballMesh.scale.setScalar(1);
      b.y = cY + (resc.ty - cY) * e + Math.sin(Math.PI * e) * 4;
      bird.position.set(b.x, b.y + HANG, -b.d);
    } else if(t < TA + TB + TC){                         // そっと下ろす
      const e = ease((t - TA - TB) / TC);
      b.x = resc.tx; b.d = resc.td; b.y = resc.ty + (1 - e) * 1.2;
      bird.position.set(b.x, b.y + HANG, -b.d);
    } else {                                             // はなして、とりは飛んでいく
      b.x = resc.tx; b.d = resc.td; b.y = resc.ty;
      b.vx = 0; b.vy = 0; b.vd = 3; b.grounded = true; b.inv = 2; camYaw = 0;
      b.trail = [{x:resc.tx, d:resc.td, y:resc.ty}]; b.trailT = 0;
      birdExit = {t:0};
      state = "playing";
    }
  } else if(state === "dead"){
    deadTimer += dt;
    if(b.fell){
      b.vy -= GRAV * dt; b.y += b.vy * dt;           // 落ち続けながら小さくなる
      ballMesh.scale.setScalar(fallScale());
    } else {
      ballMesh.scale.setScalar(Math.max(0.01, 1 - deadTimer * 2.2));
    }
    if(deadTimer > (b.retry ? (b.fell ? 1.8 : 0.7) : (b.fell ? 2.6 : 0.8))){
      if(b.retry){
        respawn();                                       // ライフが残っている：続きから
      } else {
        state = "over";                                  // ライフがゼロ：本当におしまい
        endTouch();
        show("GAME OVER", "No lives left", "RETRY");
      }
    }
  }

  if(birdExit){
    birdExit.t += dt;
    const turn = Math.max(0, 1 - birdExit.t / 0.5);       // 飛び去るときは前を向く
    bird.rotation.y = Math.PI * turn; bird.rotation.x = -0.25 * turn;
    bird.position.x += 2.5 * dt; bird.position.y += 9 * dt; bird.position.z -= 7 * dt;
    if(birdExit.t > 1.4){ birdExit = null; bird.visible = false; }
  }
  if(bird.visible){
    const fl = Math.sin(time * (state === "rescue" ? 32 : 24)) * 0.85;
    bird.userData.wings[0].rotation.z = fl;
    bird.userData.wings[1].rotation.z = -fl;
  }
  ballMesh.position.set(b.x, b.y + R, -b.d);

  // カメラ
  const cy = b.y + 4.4;
  // ボールの進む向きに合わせて、カメラも左右に向きを変える（背景も一緒に回り込む）
  let yawT = camYaw;                         // ゆっくりのときは今の向きのまま
  if(state === "playing" && Math.hypot(b.vx, b.vd) > 2.5) yawT = Math.atan2(b.vx, b.vd);   // 後ろ向きに進めば、景色も後ろを向く
  else if(state === "rescue") yawT = 0;
  const dyaw = Math.atan2(Math.sin(yawT - camYaw), Math.cos(yawT - camYaw));
  camYaw += dyaw * Math.min(1, dt * 2.5);
  const sy = Math.sin(camYaw), cyw = Math.cos(camYaw);
  camera.position.x = b.x - b.x * 0.45 * Math.max(0, cyw) - sy * 7.6;
  camera.position.y += (cy - camera.position.y) * Math.min(1, dt * 4);
  camera.position.z = -b.d + cyw * 7.6;
  camLook.set(camera.position.x * 0.4 + (b.x + sy * 7) * 0.6, b.y + 0.4, -b.d - cyw * 7);
  camera.lookAt(camLook);
  if(skyRef) skyRef.position.copy(camera.position);
  if(layers){                                   // 背景の層を、ボールの動きに合わせて少しずつずらす（奥ほど小さく）
    const byc = Math.max(-12, Math.min(12, b.y));
    layers.sun.position.set(-b.x * 1.4, -byc * 0.5, 0);
    layers.clouds.position.set(-b.x * 0.3 + Math.sin(time * 0.12) * 2.5, -byc * 0.1, 0);
    layers.sea.position.set(-b.x * 0.12 + Math.sin(time * 0.09) * 3, 0, 0);
    layers.isl.position.set(-b.x * 0.4, -byc * 0.12 + Math.sin(time * 0.5) * 0.4, 0);
  }
}

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  try{ update(dt); }catch(e){ showErr(e && e.message ? e.message : String(e)); }
  renderer.render(scene, camera);
}

// 初期表示
buildLevel(level);
resetBall();
$("go").textContent = "START";
$("hud").style.visibility = "hidden";
refreshGear();
applySkin(skinId);
updateRescueHud();
renderLives();
maybeIntro();
loop();
})();
</script>
